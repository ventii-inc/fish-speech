[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:fish-speech-api]
command=/workspace/fish-speech/.venv/bin/python -m tools.api_server
    --listen %(ENV_FISH_LISTEN)s
    --llama-checkpoint-path %(ENV_FISH_LLAMA_CHECKPOINT)s
    --decoder-checkpoint-path %(ENV_FISH_DECODER_CHECKPOINT)s
    --decoder-config-name %(ENV_FISH_DECODER_CONFIG)s
directory=/workspace/fish-speech
environment=
    SENTRY_DSN="%(ENV_SENTRY_DSN)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s",
    LOG_FORMAT="%(ENV_LOG_FORMAT)s",
    RATE_LIMIT_ENABLED="%(ENV_RATE_LIMIT_ENABLED)s",
    RATE_LIMIT_PER_KEY="%(ENV_RATE_LIMIT_PER_KEY)s",
    RATE_LIMIT_PER_IP="%(ENV_RATE_LIMIT_PER_IP)s"
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/fish-speech/api.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/var/log/fish-speech/api-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
